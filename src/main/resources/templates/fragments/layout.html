<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' - Student Register'">Student Register</title>
    <script>
        // Apply the saved text size before the page paints, so there is no flicker.
        try {
            var saved = parseFloat(localStorage.getItem('uiScale'));
            if (saved) { document.documentElement.style.fontSize = saved + '%'; }
        } catch (e) { /* storage unavailable, keep the default size */ }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/js/app.js}" defer></script>
</head>

<body>
<header class="topbar" th:fragment="topbar(active)">
    <a class="brand" th:href="@{/students}">
        <span class="brand-mark" aria-hidden="true">S</span>
        <span class="brand-name">Student Register</span>
    </a>

    <nav class="nav" aria-label="Main">
        <a th:href="@{/students}" th:classappend="${active == 'students'} ? 'active'"
           th:attr="aria-current=${active == 'students'} ? 'page'">Students</a>
        <a th:href="@{/students/new}" th:classappend="${active == 'new'} ? 'active'"
           th:attr="aria-current=${active == 'new'} ? 'page'">Add student</a>
    </nav>

    <div class="text-size" role="group" aria-label="Text size">
        <button type="button" class="size-btn" data-size="down" aria-label="Decrease text size" title="Smaller text">A&minus;</button>
        <button type="button" class="size-value" data-size="reset" data-size-value aria-label="Reset text size" title="Reset to 100%">100%</button>
        <button type="button" class="size-btn" data-size="up" aria-label="Increase text size" title="Larger text">A+</button>
    </div>
</header>

<div th:fragment="flash">
    <p class="flash" role="status" th:if="${success}" th:text="${success}">Saved.</p>
</div>
</body>
</html>
